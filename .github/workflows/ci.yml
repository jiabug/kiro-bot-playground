name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==8.3.5 pytest-cov==7.1.0 -e .
      - run: pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
